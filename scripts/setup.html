<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture+ · Настройка на этом компьютере</title>
<style>body{background:#0e1626;color:#eaf2ff;font:16px/1.6 system-ui;max-width:550px;margin:70px auto;padding:24px}h1{line-height:1.2}label{display:block;margin:24px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:10px;border:1px solid #34486a;background:#16233b;color:#eaf2ff}button{background:#5b9df5;color:#0e1626;font-weight:bold;cursor:pointer}a{color:#8ebeff}small{color:#9fb4d8}#result{white-space:pre-wrap}</style>
<h1>Подключить AI к Lecture+</h1><p>Эта страница работает только на вашем компьютере. Значения сохранятся в локальный файл настроек и не появятся в переписке.</p><p>Используйте <b>новый ключ</b>. Ранее опубликованный ключ нужно отозвать в <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq Console</a>.</p>
<form id="form"><label>Новый Groq API key<input id="key" type="password" autocomplete="off" required placeholder="gsk_…"></label><label>Код доступа к вашему сайту<input id="code" type="password" autocomplete="new-password" minlength="12" maxlength="128" required placeholder="Минимум 12 символов"><small>Этот код вводит команда на сайте. Он отличается от API-ключа.</small></label><button>Сохранить настройки</button></form><p id="result" role="status"></p><p><a href="/">Открыть Lecture+</a></p>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const r=await fetch('/__setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value.trim(),code:document.getElementById('code').value})});const d=await r.json();document.getElementById('result').textContent=d.message||d.error;if(r.ok){document.getElementById('key').value='';document.getElementById('code').value='';}}catch{document.getElementById('result').textContent='Не удалось сохранить. Проверьте, что локальный сервер запущен.'}finally{b.disabled=false}};</script></html>
