<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Lecture plus brand board">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EDF4FF"/><stop offset="1" stop-color="#F7F4FF"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8CC1FF"/><stop offset="1" stop-color="#3F86F4"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".94"/><stop offset="1" stop-color="#EFF6FF" stop-opacity=".7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#294170" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#canvas)"/>
  <circle cx="140" cy="90" r="220" fill="#8CC1FF" opacity=".18"/>
  <circle cx="1510" cy="1160" r="300" fill="#A48BFF" opacity=".12"/>

  <g transform="translate(96 72)">
    <text x="0" y="58" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Lecture</text>
    <circle cx="270" cy="38" r="27" fill="url(#mark)" stroke="#FFFFFF" stroke-opacity=".36"/>
    <path d="M258 38h24M270 26v24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="104" fill="#52617A" font-family="Public Sans, Segoe UI, sans-serif" font-size="18">From what you learned to what comes next.</text>
  </g>

  <text x="96" y="238" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="28" font-weight="700">Core palette</text>
  <g font-family="Public Sans, Segoe UI, sans-serif" font-size="16">
    <g transform="translate(96 270)"><rect width="160" height="112" rx="20" fill="#EDF4FF" stroke="#D9E5F7"/><text x="0" y="142" fill="#10182B" font-weight="600">Canvas</text><text x="0" y="166" fill="#52617A">#EDF4FF</text></g>
    <g transform="translate(280 270)"><rect width="160" height="112" rx="20" fill="#FFFFFF" stroke="#D9E5F7"/><text x="0" y="142" fill="#10182B" font-weight="600">Paper</text><text x="0" y="166" fill="#52617A">#FFFFFF</text></g>
    <g transform="translate(464 270)"><rect width="160" height="112" rx="20" fill="#10182B"/><text x="0" y="142" fill="#10182B" font-weight="600">Ink</text><text x="0" y="166" fill="#52617A">#10182B</text></g>
    <g transform="translate(648 270)"><rect width="160" height="112" rx="20" fill="#52617A"/><text x="0" y="142" fill="#10182B" font-weight="600">Ink soft</text><text x="0" y="166" fill="#52617A">#52617A</text></g>
    <g transform="translate(832 270)"><rect width="160" height="112" rx="20" fill="#397FF2"/><text x="0" y="142" fill="#10182B" font-weight="600">Accent</text><text x="0" y="166" fill="#52617A">#397FF2</text></g>
    <g transform="translate(1016 270)"><rect width="160" height="112" rx="20" fill="#8CC1FF"/><text x="0" y="142" fill="#10182B" font-weight="600">Accent light</text><text x="0" y="166" fill="#52617A">#8CC1FF</text></g>
    <g transform="translate(1200 270)"><rect width="160" height="112" rx="20" fill="#167452"/><text x="0" y="142" fill="#10182B" font-weight="600">Success</text><text x="0" y="166" fill="#52617A">#167452</text></g>
    <g transform="translate(1384 270)"><rect width="120" height="112" rx="20" fill="#B43A47"/><text x="0" y="142" fill="#10182B" font-weight="600">Error</text><text x="0" y="166" fill="#52617A">#B43A47</text></g>
  </g>

  <text x="96" y="515" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="28" font-weight="700">Typography</text>
  <text x="96" y="590" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Less catching up.</text>
  <text x="96" y="650" fill="#397FF2" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="44" font-weight="600" letter-spacing="-1.5">More understanding.</text>
  <text x="96" y="708" fill="#52617A" font-family="Public Sans, Segoe UI, sans-serif" font-size="22">Public Sans · body, labels and supporting information</text>

  <text x="890" y="515" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="28" font-weight="700">Liquid Glass</text>
  <g transform="translate(890 548)" filter="url(#shadow)">
    <rect width="610" height="208" rx="32" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".82"/>
    <path d="M70 1h470" stroke="#FFFFFF" stroke-opacity=".9"/>
    <circle cx="76" cy="104" r="42" fill="url(#mark)" opacity=".94"/>
    <path d="M58 104h36M76 86v36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="142" y="92" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="32" font-weight="700">Strong glass surface</text>
    <text x="142" y="132" fill="#52617A" font-family="Public Sans, Segoe UI, sans-serif" font-size="18">94% → 70% white · 30 px blur · 32 px radius</text>
  </g>

  <text x="96" y="850" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="28" font-weight="700">Logo variants</text>
  <g transform="translate(96 890)">
    <rect width="420" height="200" rx="32" fill="#FFFFFF" stroke="#D9E5F7"/>
    <text x="44" y="116" fill="#10182B" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Lecture</text>
    <circle cx="292" cy="96" r="24" fill="url(#mark)"/><path d="M282 96h20M292 86v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(548 890)">
    <rect width="420" height="200" rx="32" fill="#10182B"/>
    <text x="44" y="116" fill="#F1F6FF" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Lecture</text>
    <circle cx="292" cy="96" r="24" fill="url(#mark)"/><path d="M282 96h20M292 86v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(1000 890)">
    <rect width="500" height="200" rx="32" fill="#FFFFFF" stroke="#D9E5F7"/>
    <circle cx="90" cy="100" r="56" fill="url(#mark)"/><path d="M66 100h48M90 76v48" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <text x="174" y="92" fill="#10182B" font-family="Public Sans, Segoe UI, sans-serif" font-size="18" font-weight="600">Standalone mark</text>
    <text x="174" y="126" fill="#52617A" font-family="Public Sans, Segoe UI, sans-serif" font-size="16">Use from 8 mm in print</text>
  </g>

  <text x="96" y="1160" fill="#52617A" font-family="Public Sans, Segoe UI, sans-serif" font-size="16">Lecture+ brand kit · Light Liquid Glass · Figma-ready SVG</text>
</svg>
